[package]
name = "av"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The Asciiverse terminal client: browse, install and launch terminal games"
publish = false

[dependencies]
anyhow = "1.0.104"
avt = "0.18.0"
directories = "6.0.0"
env_logger = "0.11.11"
flate2 = "1.1.10"
libc = "0.2.190"
log = "0.4.34"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
unicode-width = "0.2.2"
ureq = "3.4.2"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
