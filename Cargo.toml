[package]
name = "av"
version = "0.9.14"
edition = "2024"
rust-version = "1.88"
description = "Asciiverse terminal client: browse, install and launch terminal games"
license = "MIT"
repository = "https://github.com/theasciiverse/av"
homepage = "https://asciiverse.sh"
readme = "README.md"
keywords = ["terminal", "tui", "games", "launcher", "ascii"]
categories = ["command-line-utilities", "games"]
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
avt = "0.18.0"
directories = "6.0.0"
env_logger = "0.11.11"
flate2 = "1.1.10"
libc = "0.2.190"
log = "0.4.34"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
unicode-width = "0.2.2"
ureq = "3.4.2"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"

# `cargo deb`, run by the release workflow on the musl builds; the generated
# assets come from dist/deb-assets.sh
[package.metadata.deb]
name = "av"
maintainer = "David Sandquist <sandquist@gmail.com>"
copyright = "2026, David Sandquist"
section = "games"
priority = "optional"
changelog = "target/deb-assets/changelog"
license-file = ["target/deb-assets/copyright", "0"]
# av itself is static; these are what it runs and what most titles load.
# Recommends, as av works without each, and apt installs them by default.
# The names hold on Debian 12 and 13 and Ubuntu 24.04 to 26.04
recommends = "fontconfig, fonts-dejavu-core, xdg-utils, telnet, libasound2t64 | libasound2, libudev1"
suggests = "wl-clipboard | xclip | xsel"
extended-description = """\
The Asciiverse client: the whole catalog of text-mode games, programs, text \
adventures, art and MUDs in your terminal. Browse it, watch each title's \
preview, then install, update and launch, in whatever terminal you already use."""
assets = [
    ["target/release/av", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/av/", "644"],
    ["dist/lintian-overrides", "usr/share/lintian/overrides/av", "644"],
    ["dist/av.1", "usr/share/man/man1/", "644"],
    ["dist/asciiverse.desktop", "usr/share/applications/", "644"],
    ["dist/asciiverse.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["target/deb-assets/48/asciiverse.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["target/deb-assets/128/asciiverse.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["target/deb-assets/256/asciiverse.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["target/deb-assets/av.bash", "usr/share/bash-completion/completions/av", "644"],
    ["target/deb-assets/_av", "usr/share/zsh/vendor-completions/", "644"],
    ["target/deb-assets/av.fish", "usr/share/fish/vendor_completions.d/", "644"],
]
